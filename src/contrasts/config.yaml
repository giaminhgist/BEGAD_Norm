# Absolute features + cross-task contrasts on the 33-feature x 4-task dataset.
#
# Contrast features (18 in total), built from the raw wide matrix BEFORE any
# imputation so that missingness propagates and is handled by the per-fold
# imputer inside the training pipeline:
#   ratio-log (valid only when both components are positive):
#     D023, A002, A003:  contrast_21 = log(x_KD2 / x_KD1),
#                        contrast_31 = log(x_KD3 / x_KD1)
#   difference (signed features; no log transform):
#     D025, D026, D035, D036, D017, D022:
#                        contrast_21 = x_KD2 - x_KD1,
#                        contrast_31 = x_KD3 - x_KD1
# If a component is missing or (ratio features) not positive, the contrast is
# missing and imputed per fold (median, fitted on the training split only).
# READING is kept as its own task, not treated as a fourth KD difficulty level;
# contrasts are not interpreted as "cognitive load responses" (they may also
# reflect layout differences and task demands).
#
# Representations (same tuning budget and protocol across all three):
#   abs132:    all 132 absolute features (33 x 4 tasks)           = 132
#   abs150:    abs132 + 18 contrasts                              = 150
#   compact84: 33 KD1 + 33 READING + 18 contrasts                 = 84
#
# Models: elastic-net logistic regression (primary) and calibrated SVM-RBF
# (control), with the identical grids as the fusion experiment. For each
# (problem, fold, representation) hyperparameters are selected by inner CV
# (4 folds, seed 42, mean log-loss) on the training fold, then the model is
# refitted on the full training fold. Inner OOF probabilities (inner-inner
# seed 7) supply the training-level Youden-J threshold and the inner log-loss.
# Models are unweighted; threshold 0.5 for headline binary metrics.

experiment:
  name: contrasts
  description: >-
    3 representations (132 absolute, 132 absolute + 18 cross-task contrasts,
    84 compact = KD1 + READING + contrasts) x 2 model types (elastic-net LR,
    calibrated SVM-RBF) x 3 problems x 4 folds, identical nested tuning
    protocol and identical outer splits as the fusion experiment and the
    baselines.

data:
  wide_csv: processed_dataset/processed_dataset_33feat_wide.csv
  label_col: group
  id_col: subject_id
  n_feature_columns: 132
  class_weight: null

contrasts:
  ratio_log: [D023, A002, A003]          # time/count features, positive in this dataset
  difference: [D025, D026, D035, D036, D017, D022]   # signed saccade/coupling/temporal features
  pairs:
    "21": [KD2, KD1]
    "31": [KD3, KD1]
  expected_n: 18

representations:
  abs132:
    abs_tasks: [KD1, KD2, KD3, READING]
    add_contrasts: false
    n_features: 132
  abs150:
    abs_tasks: [KD1, KD2, KD3, READING]
    add_contrasts: true
    n_features: 150
  compact84:
    abs_tasks: [KD1, READING]
    add_contrasts: true
    n_features: 84

split:
  assignments_csv: processed_dataset/splits/cv_fold_assignments.csv
  heldout_csv: processed_dataset/splits/heldout_ad_subjects.csv
  n_folds: 4
  n_cv_subjects: 153
  n_heldout_ad: 4
  expect:
    ad_val: 7
    ad_train: 9

problems:
  - name: co_mci_ad
    include_groups: [CN, MCI, AD]
    positive: null
  - name: co_vs_mci
    include_groups: [CN, MCI]
    positive: MCI
  - name: co_vs_ad
    include_groups: [CN, AD]
    positive: AD

cv:
  n_folds: 4
  inner_folds: 4
  inner_inner_folds: 4
  inner_seed: 42
  inner_inner_seed: 7
  unit: participant
  stratify_by: group

models:
  elasticnet:
    grid:
      C: [0.01, 0.1, 1.0, 10.0]
      l1_ratio: [0.1, 0.5, 0.9]
  svm_rbf:
    grid:
      C: [0.1, 1.0, 10.0]
      gamma_scale_mult: [0.1, 1.0, 10.0]
    calibrate: {cv: adaptive_min5, method: sigmoid}

threshold: 0.5
youden:
  source: inner_oof

output:
  dir: output/contrasts
  detail_csv: results/results_detail.csv
  smoke_csv: results/smoke_detail.csv
  summary_csv: results/summary.csv
  paired_deltas_csv: results/paired_deltas.csv
  contrast_manifest_csv: results/contrast_manifest.csv
  proba_prefix: results/proba
  run_log_csv: run_log.csv
