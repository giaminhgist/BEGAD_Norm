# Config for the selfcheck fixture only; mirrors the two experiment configs.
data:
  wide_csv: processed_dataset/processed_dataset_33feat_wide.csv
  label_col: group
  id_col: subject_id
  n_feature_columns: 132

split:
  assignments_csv: processed_dataset/splits/cv_fold_assignments.csv
  heldout_csv: processed_dataset/splits/heldout_ad_subjects.csv
  n_cv_subjects: 153
  n_heldout_ad: 4

problems:
  - name: co_mci_ad
    include_groups: [CN, MCI, AD]
    positive: null
  - name: co_vs_mci
    include_groups: [CN, MCI]
    positive: MCI
  - name: co_vs_ad
    include_groups: [CN, AD]
    positive: AD

contrasts:
  ratio_log: [D023, A002, A003]
  difference: [D025, D026, D035, D036, D017, D022]
  pairs:
    "21": [KD2, KD1]
    "31": [KD3, KD1]
  expected_n: 18
