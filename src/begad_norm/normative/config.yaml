# Normative-model experiment — learned CO-normative deviations (port of
# LNGModel EXP-PROP-001, mlp_deepset), BEGAD group classification.
# One sample per participant: 25 processed_dataset features x 11 tasks with
# presence masks (missing cells filled with the train-fold per-feature mean,
# standardized per fold on the training split; all-NaN tasks masked).
# Class-imbalance handling: train-fold inverse-frequency loss weights
# (matches the baseline's class_weight: balanced). No threshold tuning:
# binary predictions use the fixed default threshold 0.5.
# Reproducibility: every input below is fixed; results are deterministic
# given the recorded data files, code, and environment
# (see outputs/normative/provenance.json).

experiment:
  name: normative_main
  description: >-
    Learned normative-deviation model (mlp_deepset, port of LNGModel
    EXP-PROP-001) on the processed dataset. 1 dataset x 3 problems x 1
    model x 20 seeds x 5-fold participant-level CV = 300 evaluations.

data:
  # Feature sets; the feature list of each dataset is read from its
  # features.csv columns (participant_id, task excluded).
  datasets:
    - name: processed_dataset
      features_csv: processed_dataset/features.csv
      metadata_csv: processed_dataset/metadata.csv
  n_tasks: 11
  imputation: mean_fill_train_fold   # mean-filled + standardized per fold (train stats only)
  class_weight: balanced             # train-fold inverse-frequency loss weights
  threshold: 0.5                     # fixed 0.5 decision threshold for binary problems (no tuning)

problems:
  - name: co_vs_mci
    positive: MCI
  - name: co_vs_ad
    positive: AD
  - name: co_mci_ad   # 3-class (argmax, no threshold); metrics are macro averages
    positive: null

cv:
  n_folds: 5
  seeds: [42, 2026, 1, 0, 7, 123, 1234, 2024, 2025, 1337, 2, 3, 5, 10, 21, 777, 2020, 2021, 2022, 2023]
  # 20 common seeds, identical to the baseline (locked before results).
  unit: participant
  stratify_by: group

model:
  name: normative_mlp_deepset
  deviation: learned       # learned latent deviation (encoder + CO bank + comparator)
  comparator: mlp          # g_phi([z, mu, z-mu, z*mu])
  pool: deepset            # masked mean || masked max
  d_in: 25
  latent_dim: 128
  dev_dim: 64
  dropout: 0.3

training:
  epochs: 150
  patience: 30             # early stopping on val AUC
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 16

metrics:
  - acc
  - sen     # sensitivity = recall of the disease class (binary: positive; 3-class: macro)
  - precision    # binary: disease class; 3-class: macro
  - spec    # binary: TN/(TN+FP); 3-class: mean per-class TN/(TN+FP)
  - auc     # binary: ROC-AUC of positive; 3-class: OVR macro (softmax probabilities)
  - f1      # binary: disease class; 3-class: macro

output:
  dir: outputs/normative
  detail_csv: results/results_detail.csv
  summary_csv: results/summary.csv
  run_log_csv: run_log.csv
  provenance_file: provenance.json
