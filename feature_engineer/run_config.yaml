# Frozen configuration for BEGAD feature discovery (no classifier training).
# Numeric protocol from Running_Phase/BEGAD_feature_selection_pack/03_STATISTICAL_SCREENING.md.
protocol_version: begad_feature_discovery_v2_expanded260
seed: 20261027
base_definition_count: 160
additional_definition_target: 100
candidate_origins: [base160, dataset100]
require_candidate_freeze: true
contrasts: [CN_AD, CN_MCI, MCI_AD]
primary_test: mannwhitneyu_two_sided_asymptotic_tie_corrected
continuity_correction: true
screen_p: 0.20
main_screen: CN_AD_AND_CN_MCI
strict_screen: ALL_THREE_PAIRS
minimum_subjects_per_group: 8
minimum_group_coverage: 0.60
minimum_roi_coverage_for_task_roi_summaries: 0.60
coverage_sensitivity: [0.50, 0.75]
fdr_method: fdr_bh
fdr_support_q: 0.10
fdr_dependence_sensitivity: fdr_by
preferred_abs_cliffs_delta: 0.20
preferred_direction_stability: 0.80
preferred_selection_frequency: 0.60
redundancy_abs_spearman: 0.90
bootstrap_effect_ci_resamples: 2000
bootstrap_discovery_resamples: 500
permutation_validation_resamples: 9999
roi_top_k: 20

# File-02 extraction support rules (operational screening defaults)
extraction_support:
  single_event_min: 1
  median_min_events: 1
  dispersion_min: 3
  p90_min: 10
  spatial_entropy_min_fixations: 10
  transition_entropy_min_transitions: 30
  articulation_ratio_guard_s: 0.05
  speech_delay_censor: "<=0 or >=10 s"
  gap_tolerance_ms: 10
  saccade_onset_tolerance_ms: 5
  mm_per_px: 0.2676

# Inputs (relative to repository root). Cleaned workbooks are inventoried but never tested.
sources:
  t1235_xlsx: T1235.xlsx
  t5_xlsx: T5.xlsx
  t1235_clean_xlsx: T1235_clean.xlsx
  t5_clean_xlsx: T5_clean.xlsx
  participants_csv: dataset/participants_20250305.csv
  raw_dir: dataset/20250305
  raw_v2_dir: dataset_v2/20250305

cohorts:
  primary_roi_ranking: ROI64_T1235
  reading_sensitivity: ROI64_T5
  raw_macro: RAW157
