# Row-level classification on T1235_clean.xlsx (12,486 rows, 64
# participants CO 32 / MCI 17 / AD 15, tasks 1/2/3/5, pupil NaN cells kept
# and median-imputed per fold on the training split only).
#
# Split styles (cv.splits), split seed fixed at 42, 10 folds:
#   grouped — participant-level stratified round-robin (baseline's
#             stratified_folds); evaluated at row AND subject level.
#   random  — row-level StratifiedKFold(10, shuffle, random_state=42),
#             stratify by y; row-level metrics only (deliberately leaky
#             arm to quantify leakage).
# 5 model seeds feed RF / LGBM / FNN / torch; LR and SVM-RBF are
# deterministic (their repeats are identical).
#
# Models: logistic_regression, svm_rbf, random_forest, lightgbm, fnn
# (balanced class weights on row counts) + torch_multimodal (PyTorch port
# of Multimodal.ipynb; pupil branch takes all 9 pupil columns + ROI per
# user decision).
#
# Reproducibility: every input below is fixed; results are deterministic
# given the recorded data file, code, and environment (see
# T1235/provenance.json).

experiment:
  name: t1235_rowlevel_clean
  description: >-
    Row-level classification on T1235_clean.xlsx: 3 problems x 6 models
    (5 sklearn + torch multimodal) x 5 model seeds x 10 folds x 2 splits
    (grouped / random); grouped evaluated at row + subject level, random
    at row level only. Split seed fixed at 42.

data:
  dataset_name: T1235
  xlsx_path: T1235_clean.xlsx        # relative to the repo root
  columns: [group, pat, task, ROI, nFixations, nTobiiSaccades,
    regSaccades, longSaccades, tinySaccades, saccadeTotLength,
    totalFixTime, totalSpokenTime, speechDelay, endSpeechDelay,
    startPupLB, startPupRB, endPupLB, endPupRB, diffPupL, diffPupR,
    maxPupLB, minPupLB, diffXpupL]
  n_patients: 64
  feature_columns: [nFixations, nTobiiSaccades, regSaccades, longSaccades,
    tinySaccades, saccadeTotLength, totalFixTime, totalSpokenTime,
    speechDelay, endSpeechDelay, startPupLB, startPupRB, endPupLB,
    endPupRB, diffPupL, diffPupR, maxPupLB, minPupLB, diffXpupL]
  roi_column: ROI
  branch_features:                    # torch arm; ROI appended last per branch
    visual: [nFixations, nTobiiSaccades, regSaccades, longSaccades,
      tinySaccades, saccadeTotLength]              # 6 + ROI = 7d
    speech: [totalFixTime, totalSpokenTime, speechDelay, endSpeechDelay]
                                                   # 4 + ROI = 5d
    pupil: [startPupLB, startPupRB, endPupLB, endPupRB, diffPupL, diffPupR,
      maxPupLB, minPupLB, diffXpupL]               # 9 + ROI = 10d
  imputation: median_per_fold
  class_weight: balanced              # row-count-based (LR/SVM/RF/LGBM weights; FNN sample weights)
  threshold: 0.5

problems:
  - name: co_vs_mci
    include_groups: [CO, MCI]   # positive class = MCI
    positive: MCI
  - name: co_vs_ad
    include_groups: [CO, AD]    # positive class = AD
    positive: AD
  - name: co_mci_ad
    include_groups: [CO, MCI, AD]  # 3-class (argmax, no threshold)
    positive: null                  # metrics are macro averages

cv:
  n_folds: 10
  split_seed: 42
  model_seeds: [42, 2026, 1, 0, 7]
  splits: [grouped, random]
  eval_levels:
    grouped: [row, subject]
    random: [row]
  torch:
    max_epochs: 300
    patience: 15                    # early stopping on validation loss
    batch_size: 32
    lr: 0.001
    l2: 0.001
    dropout: 0.2
    val_fraction: 0.2               # carved from the train split

models:
  logistic_regression:
    class: LogisticRegression
    kwargs: {max_iter: 2000}
  svm_rbf:
    class: SVC
    kwargs: {C: 1.0, kernel: rbf, gamma: scale, probability: true}
  random_forest:
    class: RandomForestClassifier
    kwargs: {n_estimators: 100}
  lightgbm:
    class: LGBMClassifier
    kwargs: {n_estimators: 100, verbosity: -1}
  fnn:
    class: MLPClassifier
    kwargs:
      hidden_layer_sizes: [64, 32]
      activation: relu
      solver: adam
      alpha: 0.0001
      batch_size: 32
      learning_rate_init: 0.001
      max_iter: 300

metrics:
  - acc
  - sen
  - precision
  - spec
  - auc
  - f1

execution:
  n_jobs: 8

output:
  dir: T1235                          # relative to the repo root
  detail_csv: results/results_detail.csv
  summary_csv: results/summary.csv
  run_log_csv: run_log.csv
  smoke_csv: results/smoke_detail.csv
  missingness_csv: results/missingness.csv
  fit_times_csv: results/fit_times.csv
  folds_dir: folds
  code_dir: code
