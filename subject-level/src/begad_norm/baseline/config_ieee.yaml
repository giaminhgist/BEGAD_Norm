# IEEE feature-set baseline — BEGAD group classification, participant-wide
# Same protocol as config.yaml (baseline_balanced): one sample per
# participant, features x 11 tasks flattened wide (feature-major), 16 IEEE
# features x 11 tasks = 176 columns. The IEEE paper's 20 features map to 16
# on BEGAD: ROI (feature 1) and the 3 speech features are unavailable (no
# AOI annotations, no audio data). Pupil features are baseline-corrected
# per the paper; participants without a pupil baseline keep NaN on the
# absolute pupil features of the affected eye (per-fold median imputation,
# same treatment as the pupbl features of the main baseline).
# Class-imbalance handling, threshold, CV, seeds, models and metrics are
# identical to baseline_balanced -> matched comparison.

experiment:
  name: baseline_ieee
  description: >-
    Baseline classifiers on participant-wide IEEE-mapped features
    (16 x 11 tasks, feature-major). 1 dataset x 3 problems x 6 models x
    20 seeds x 5-fold participant-level CV = 1800 train/test evaluations.

data:
  datasets:
    - name: ieee_features
      label: IEEE 16 features (8 visual - 1 ROI + 9 pupillary; 3 speech unavailable)
      features_csv: processed_dataset/ieee_features.csv
      metadata_csv: processed_dataset/metadata.csv
  sample_mode: participant_wide        # one row per participant, features x 11 tasks
  n_tasks: 11
  wide_layout: feature-major           # columns ordered {feature}_t{task}, task 0..10
  imputation: median_per_fold          # median imputation, fitted on the training split of each fold
  class_weight: balanced               # balanced weights (LR/SVM/MLP) + inverse-frequency priors (QDA/GNB)
  threshold: 0.5                       # fixed 0.5 decision threshold for binary problems (no tuning)

problems:
  - name: co_vs_mci
    include_groups: [CO, MCI]   # positive class = MCI
    positive: MCI
  - name: co_vs_ad
    include_groups: [CO, AD]    # positive class = AD
    positive: AD
  - name: co_mci_ad
    include_groups: [CO, MCI, AD]  # 3-class (argmax, no threshold)
    positive: null                  # metrics are macro averages

cv:
  n_folds: 5
  seeds: [42, 2026, 1, 0, 7, 123, 1234, 2024, 2025, 1337, 2, 3, 5, 10, 21, 777, 2020, 2021, 2022, 2023]
  # 20 common seeds, fixed BEFORE results were seen; same schedule as
  # baseline_balanced -> matched folds per seed.
  unit: participant                          # one sample per participant
  stratify_by: group

models:
  logistic_regression:
    class: LogisticRegression
    kwargs: {max_iter: 2000}
  svm_rbf:
    class: SVC
    kwargs: {C: 1.0, kernel: rbf, gamma: scale, probability: true}
  svm_linear:
    class: SVC
    kwargs: {C: 1.0, kernel: linear, probability: true}
  fnn:
    class: MLPClassifier
    kwargs:
      hidden_layer_sizes: [64, 32]
      activation: relu
      solver: adam
      alpha: 0.0001
      batch_size: 32
      learning_rate_init: 0.001
      max_iter: 300
  qda:
    class: QuadraticDiscriminantAnalysis
    kwargs: {solver: eigen, shrinkage: 0.5}
  gnb:
    class: GaussianNB
    kwargs: {var_smoothing: 1.0e-09}

metrics:
  - acc
  - sen     # sensitivity = recall of the disease class (binary: positive; 3-class: macro)
  - precision    # binary: disease class; 3-class: macro
  - spec    # binary: TN/(TN+FP); 3-class: mean per-class TN/(TN+FP)
  - auc     # binary: ROC-AUC of positive; 3-class: OVR macro (predict_proba)
  - f1      # binary: disease class; 3-class: macro

output:
  dir: outputs/baseline_ieee
  detail_csv: results/results_detail.csv
  summary_csv: results/summary.csv
  run_log_csv: run_log.csv
  smoke_csv: results/smoke_detail.csv
  missingness_csv: results/missingness.csv
