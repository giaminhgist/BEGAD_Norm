[project]
name = "begad-norm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gia Minh Hoang", email = "hoang.giaminh0596@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pypdf>=6.20.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
begad-norm = "begad_norm:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
